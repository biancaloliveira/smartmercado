<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras & Estoque</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans select-none">

  <!-- Cabeçalho -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 p-4 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i data-lucide="shopping-bag" class="w-6 h-6 text-emerald-400"></i>
        <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">Minhas Compras</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="abrirModalUsuario()" id="btn-usuario" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-emerald-300 text-xs flex items-center gap-1 font-medium transition">
          <i data-lucide="user" class="w-3.5 h-3.5"></i> <span id="lbl-usuario">Convidado</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="app-content">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
          <i data-lucide="package" class="w-5 h-5"></i> Controle de Estoque
        </h2>
        <span class="text-xs text-slate-400">Ajuste rápido (+ / -)</span>
      </div>
      <p class="text-xs text-slate-400 mb-4">Altere a quantidade em estoque diretamente na lista abaixo sem abrir edições:</p>
      
      <div id="lista-estoque" class="space-y-3">
        <!-- Itens carregados dinamicamente pelo JavaScript -->
      </div>
    </div>
  </main>

  <!-- Modal Identificação de Usuário -->
  <div id="modal-usuario" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-xs rounded-xl p-5 shadow-2xl space-y-4">
      <h3 class="text-base font-bold text-slate-100">Quem está usando?</h3>
      <p class="text-xs text-slate-400">Informe seu nome para salvar o controle de estoque.</p>
      <input type="text" id="input-nome-usuario" placeholder="Seu nome (ex: Maria)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="salvarUsuario()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold">Salvar Nome</button>
      </div>
    </div>
  </div>

  <script>
    // Lista padrão com os itens categorizados
    const itensPadrao = [
      { id: 1, nome: "Sabão em pó", categoria: "Limpeza e Lavanderia", estoqueAtual: 1, estoqueMinimo: 2, unidade: "pacote" },
      { id: 2, nome: "Oleo", categoria: "Mercearia e Grãos", estoqueAtual: 2, estoqueMinimo: 3, unidade: "L" },
      { id: 3, nome: "Sabonetes", categoria: "Higiene Pessoal", estoqueAtual: 4, estoqueMinimo: 5, unidade: "un" },
      { id: 4, nome: "Suco", categoria: "Mercearia e Grãos", estoqueAtual: 2, estoqueMinimo: 4, unidade: "un" },
      { id: 5, nome: "Maionese Tradicional", categoria: "Mercearia e Grãos", estoqueAtual: 1, estoqueMinimo: 1, unidade: "un" },
      { id: 6, nome: "Detergente", categoria: "Limpeza e Lavanderia", estoqueAtual: 3, estoqueMinimo: 4, unidade: "un" },
      { id: 7, nome: "Arroz", categoria: "Mercearia e Grãos", estoqueAtual: 2, estoqueMinimo: 2, unidade: "kg" },
      { id: 8, nome: "Feijão", categoria: "Mercearia e Grãos", estoqueAtual: 1, estoqueMinimo: 3, unidade: "kg" },
      { id: 9, nome: "Café", categoria: "Mercearia e Grãos", estoqueAtual: 1, estoqueMinimo: 2, unidade: "pacote" },
      { id: 10, nome: "Leite em pó", categoria: "Laticínios e Frios", estoqueAtual: 1, estoqueMinimo: 2, unidade: "pacote" }
    ];

    let usuarioAtual = localStorage.getItem('usuario_compras') || '';
    let meusItens = JSON.parse(localStorage.getItem('itens_estoque')) || itensPadrao;

    window.onload = function() {
      if (!usuarioAtual) {
        document.getElementById('modal-usuario').classList.remove('hidden');
      } else {
        document.getElementById('lbl-usuario').innerText = usuarioAtual;
      }
      renderizarEstoque();
    };

    function renderizarEstoque() {
      const container = document.getElementById('lista-estoque');
      container.innerHTML = '';

      meusItens.forEach((item, index) => {
        const precisaComprar = item.estoqueAtual <= item.estoqueMinimo;
        
        const card = document.createElement('div');
        card.className = `p-3 rounded-lg border flex items-center justify-between transition ${
          precisaComprar 
            ? 'bg-amber-950/30 border-amber-800/50' 
            : 'bg-slate-900 border-slate-700/80'
        }`;

        card.innerHTML = `
          <div class="flex-1 pr-2">
            <div class="flex items-center gap-2">
              <span class="font-medium text-sm text-slate-100">${item.nome}</span>
              ${precisaComprar ? '<span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded font-semibold">Repor</span>' : ''}
            </div>
            <div class="text-xs text-slate-400 mt-0.5">
              <span>Mínimo: ${item.estoqueMinimo} ${item.unidade}</span> • 
              <span class="text-slate-500">${item.categoria}</span>
            </div>
          </div>

          <!-- Controle Rápido de Estoque -->
          <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg p-1 space-x-1">
            <button onclick="alterarEstoque(${index}, -1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 font-bold flex items-center justify-center transition active:scale-95 text-base">
              -
            </button>
            
            <div class="px-2 text-center min-w-[2.5rem]">
              <span class="font-bold text-sm text-emerald-400">${item.estoqueAtual}</span>
              <span class="text-[10px] text-slate-400 block -mt-1">${item.unidade}</span>
            </div>

            <button onclick="alterarEstoque(${index}, 1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 font-bold flex items-center justify-center transition active:scale-95 text-base">
              +
            </button>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Função para alterar o estoque diretamente da tela principal
    function alterarEstoque(index, delta) {
      if (meusItens[index].estoqueAtual + delta >= 0) {
        meusItens[index].estoqueAtual += delta;
        salvarDados();
        renderizarEstoque();
      }
    }

    function salvarDados() {
      localStorage.setItem('itens_estoque', JSON.stringify(meusItens));
    }

    function abrirModalUsuario() {
      document.getElementById('input-nome-usuario').value = usuarioAtual;
      document.getElementById('modal-usuario').classList.remove('hidden');
    }

    function salvarUsuario() {
      const nome = document.getElementById('input-nome-usuario').value.trim();
      if (nome) {
        usuarioAtual = nome;
        localStorage.setItem('usuario_compras', nome);
        document.getElementById('lbl-usuario').innerText = nome;
        document.getElementById('modal-usuario').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
