<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras & Estoque</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans select-none">

  <!-- Cabeçalho -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 p-4 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i data-lucide="shopping-bag" class="w-6 h-6 text-emerald-400"></i>
        <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">MercadoSmart</h1>
      </div>
      <button onclick="abrirModalUsuario()" id="btn-usuario" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-emerald-300 text-xs flex items-center gap-1.5 font-medium transition">
        <i data-lucide="user" class="w-3.5 h-3.5"></i> <span id="lbl-usuario">Convidado</span>
      </button>
    </div>
  </header>

  <!-- Navegação por Abas Inferior -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 z-40">
    <div class="max-w-md mx-auto flex justify-around p-2">
      <button onclick="mudarAba('estoque')" id="tab-estoque" class="flex flex-col items-center p-2 text-emerald-400 font-medium text-xs">
        <i data-lucide="package" class="w-5 h-5 mb-0.5"></i> Estoque
      </button>
      <button onclick="mudarAba('comprar')" id="tab-comprar" class="flex flex-col items-center p-2 text-slate-400 hover:text-emerald-400 text-xs transition">
        <i data-lucide="list-checks" class="w-5 h-5 mb-0.5"></i> A Comprar
      </button>
      <button onclick="mudarAba('mercado')" id="tab-mercado" class="flex flex-col items-center p-2 text-slate-400 hover:text-emerald-400 text-xs transition">
        <i data-lucide="shopping-cart" class="w-5 h-5 mb-0.5"></i> Mercado
      </button>
      <button onclick="mudarAba('historico')" id="tab-historico" class="flex flex-col items-center p-2 text-slate-400 hover:text-emerald-400 text-xs transition">
        <i data-lucide="history" class="w-5 h-5 mb-0.5"></i> Histórico
      </button>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- ABA 1: ESTOQUE -->
    <section id="sec-estoque" class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
          <i data-lucide="package" class="w-5 h-5"></i> Controle de Estoque
        </h2>
        <button onclick="abrirModalItem()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1">
          <i data-lucide="plus" class="w-4 h-4"></i> Novo Item
        </button>
      </div>

      <input type="text" id="busca-estoque" oninput="renderizarTelas()" placeholder="Buscar item..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">

      <div id="lista-estoque" class="space-y-4"></div>
    </section>

    <!-- ABA 2: A COMPRAR -->
    <section id="sec-comprar" class="space-y-4 hidden">
      <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
        <i data-lucide="list-checks" class="w-5 h-5"></i> Sugestão de Compras
      </h2>
      <p class="text-xs text-slate-400">Itens com estoque atual menor ou igual ao mínimo:</p>
      <div id="lista-comprar" class="space-y-3"></div>
    </section>

    <!-- ABA 3: MERCADO -->
    <section id="sec-mercado" class="space-y-4 hidden">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 space-y-2">
        <div class="flex justify-between text-xs">
          <span class="text-slate-400">Obrigatórios: <strong id="total-obrigat" class="text-emerald-400">R$ 0,00</strong></span>
          <span class="text-slate-400">Extras: <strong id="total-extra" class="text-amber-400">R$ 0,00</strong></span>
        </div>
        <div class="text-base font-bold text-center border-t border-slate-700 pt-2 text-slate-100">
          Total da Compra: <span id="total-geral" class="text-emerald-400">R$ 0,00</span>
        </div>
      </div>

      <div id="lista-mercado" class="space-y-3"></div>

      <button onclick="finalizarCompra()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i> Finalizar Compra e Atualizar Estoque
      </button>
    </section>

    <!-- ABA 4: HISTÓRICO -->
    <section id="sec-historico" class="space-y-4 hidden">
      <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
        <i data-lucide="history" class="w-5 h-5"></i> Histórico de Compras
      </h2>
      <div id="lista-historico" class="space-y-3"></div>
    </section>

  </main>

  <!-- Modal Cadastro/Edição de Item -->
  <div id="modal-item" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-xl p-5 shadow-2xl space-y-3">
      <h3 class="text-base font-bold text-slate-100" id="titulo-modal-item">Cadastrar Item</h3>
      
      <input type="hidden" id="edit-index">
      
      <div>
        <label class="text-xs text-slate-400">Nome do Item</label>
        <input type="text" id="inp-nome" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100">
      </div>

      <div>
        <label class="text-xs text-slate-400">Categoria</label>
        <select id="inp-cat" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100">
          <option value="Mercearia e Grãos">Mercearia e Grãos</option>
          <option value="Limpeza e Lavanderia">Limpeza e Lavanderia</option>
          <option value="Higiene Pessoal">Higiene Pessoal</option>
          <option value="Laticínios e Frios">Laticínios e Frios</option>
          <option value="Carnes e Aves">Carnes e Aves</option>
          <option value="Congelados">Congelados</option>
          <option value="Descartáveis e Utensílios">Descartáveis e Utensílios</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-slate-400">Estoque Mínimo</label>
          <input type="number" id="inp-min" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100" value="1">
        </div>
        <div>
          <label class="text-xs text-slate-400">Estoque Atual</label>
          <input type="number" id="inp-atual" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100" value="0">
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400">Unidade de Medida</label>
        <select id="inp-und" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100">
          <option value="un">un (unidade)</option>
          <option value="kg">kg (quilo)</option>
          <option value="L">L (litro)</option>
          <option value="pacote">pacote</option>
        </select>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="fecharModalItem()" class="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-lg text-xs">Cancelar</button>
        <button onclick="salvarItem()" class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal Identificação Usuário -->
  <div id="modal-usuario" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-xs rounded-xl p-5 shadow-2xl space-y-4">
      <h3 class="text-base font-bold text-slate-100">Quem está usando?</h3>
      <input type="text" id="input-nome-usuario" placeholder="Seu nome" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100">
      <div class="flex justify-end gap-2">
        <button onclick="salvarUsuario()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Salvar</button>
      </div>
    </div>
  </div>

    function renderizarTelas() {
      renderizarEstoque();
      renderizarComprar();
      renderizarMercado();
      renderizarHistorico();
      lucide.createIcons();

    // 1. ABA ESTOQUE (COM BOTÕES RÁPIDOS + / -)
    function renderizarEstoque() {
      const container = document.getElementById('lista-estoque');
      const busca = document.getElementById('busca-estoque').value.toLowerCase();
      container.innerHTML = '';

      const grupos = {};
      meusItens.forEach((item, index) => {
        if (busca && !item.nome.toLowerCase().includes(busca)) return;
        if (!grupos[item.categoria]) grupos[item.categoria] = [];
        grupos[item.categoria].push({ ...item, origIndex: index });
      });

      for (const [cat, lista] of Object.entries(grupos)) {
        const sec = document.createElement('div');
        sec.className = 'bg-slate-800 border border-slate-700/80 rounded-xl overflow-hidden';
        
        let htmlItens = '';
        lista.forEach(item => {
          const repor = item.estoqueAtual <= item.estoqueMinimo;
          htmlItens += `
            <div class="p-3 border-b border-slate-700/50 last:border-b-0 flex items-center justify-between">
              <div class="flex-1 pr-2">
                <div class="flex items-center gap-1.5">
                  <span class="font-medium text-sm text-slate-100">${item.nome}</span>
                  ${repor ? '<span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1 py-0.5 rounded">Repor</span>' : ''}
                </div>
                <div class="text-xs text-slate-400">Mín: ${item.estoqueMinimo} ${item.unidade}</div>
              </div>

              <!-- Ajuste Rápido de Estoque -->
              <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-1 space-x-1">
                <button onclick="alterarEstoque(${item.origIndex}, -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 font-bold flex items-center justify-center">-</button>
                <div class="px-2 text-center min-w-[2.2rem]">
                  <span class="font-bold text-sm text-emerald-400">${item.estoqueAtual}</span>
                </div>
                <button onclick="alterarEstoque(${item.origIndex}, 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 font-bold flex items-center justify-center">+</button>
              </div>

              <button onclick="abrirModalItem(${item.origIndex})" class="ml-2 text-slate-500 hover:text-slate-300 p-1">
                <i data-lucide="edit-2" class="w-4 h-4"></i>
              </button>
            </div>
          `;
        });

        sec.innerHTML = `
          <div class="bg-slate-700/40 p-2.5 px-3 text-xs font-bold text-slate-300 flex justify-between">
            <span>${cat}</span>
            <span class="text-slate-400 font-normal">(${lista.length})</span>
          </div>
          <div>${htmlItens}</div>
        `;
        container.appendChild(sec);
      }
    }

    function alterarEstoque(index, delta) {
      if (meusItens[index].estoqueAtual + delta >= 0) {
        meusItens[index].estoqueAtual += delta;
        if (meusItens[index].estoqueAtual <= meusItens[index].estoqueMinimo) {
          meusItens[index].comprar = true;
        }
        salvarDados();
        renderizarTelas();
      }
    }

    // 2. ABA A COMPRAR
    function renderizarComprar() {
      const container = document.getElementById('lista-comprar');
      container.innerHTML = '';

      meusItens.forEach((item, index) => {
        const precisa = item.estoqueAtual <= item.estoqueMinimo;
        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700/80 p-3 rounded-lg flex items-center justify-between';
        
        card.innerHTML = `
          <div>
            <span class="font-medium text-sm text-slate-100">${item.nome}</span>
            <div class="text-xs text-slate-400">Sugestão: comprar ${(item.estoqueMinimo - item.estoqueAtual) > 0 ? (item.estoqueMinimo - item.estoqueAtual) : 1} ${item.unidade}</div>
          </div>
          <label class="flex items-center gap-2 text-xs font-medium text-slate-300 cursor-pointer">
            <span>Comprar?</span>
            <input type="checkbox" ${item.comprar ? 'checked' : ''} onchange="toggleComprar(${index})" class="w-5 h-5 accent-emerald-500 rounded">
          </label>
        `;
        container.appendChild(card);
      });
    }

    function toggleComprar(index) {
      meusItens[index].comprar = !meusItens[index].comprar;
      salvarDados();
      renderizarTelas();
    }

    // 3. ABA MERCADO
    function renderizarMercado() {
      const container = document.getElementById('lista-mercado');
      container.innerHTML = '';

      let totalObr = 0;
      let totalExt = 0;

      meusItens.forEach((item, index) => {
        if (!item.comprar) return;

        const totalItem = (item.preco || 0) * 1;
        if (item.tipo === 'Obrigatório') totalObr += totalItem;
        else totalExt += totalItem;

        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700/80 p-3 rounded-xl space-y-2';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-sm text-slate-100">${item.nome}</span>
            <button onclick="marcarEuPego(${index})" class="text-[10px] px-2 py-0.5 rounded-full border ${item.pegou ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-slate-700 text-slate-400 border-slate-600'}">
              ${item.pegou ? 'Pego por: ' + item.pegou : 'Eu Pego!'}
            </button>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <label class="text-slate-400">Preço Un (R$)</label>
              <input type="number" step="0.01" value="${item.preco || ''}" onchange="atualizarPreco(${index}, this.value)" placeholder="0,00" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-100">
            </div>
            <div>
              <label class="text-slate-400">Marca (Opcional)</label>
              <input type="text" value="${item.marca || ''}" onchange="atualizarMarca(${index}, this.value)" placeholder="Ex: Nestlé" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-100">
            </div>
          </div>

          <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-700/50">
            <button onclick="toggleTipo(${index})" class="text-[11px] font-semibold ${item.tipo === 'Obrigatório' ? 'text-emerald-400' : 'text-amber-400'}">
              ${item.tipo} (Clique p/ mudar)
            </button>
            <span class="font-bold text-slate-200">Total: R$ ${totalItem.toFixed(2)}</span>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('total-obrigat').innerText = `R$ ${totalObr.toFixed(2)}`;
      document.getElementById('total-extra').innerText = `R$ ${totalExt.toFixed(2)}`;
      document.getElementById('total-geral').innerText = `R$ ${(totalObr + totalExt).toFixed(2)}`;
    }

    function atualizarPreco(index, val) {
      meusItens[index].preco = parseFloat(val) || 0;
      salvarDados();
      renderizarMercado();
    }

    function atualizarMarca(index, val) {
      meusItens[index].marca = val;
      salvarDados();
    }

    function toggleTipo(index) {
      meusItens[index].tipo = meusItens[index].tipo === 'Obrigatório' ? 'Extra' : 'Obrigatório';
      salvarDados();
      renderizarMercado();
    }

    function marcarEuPego(index) {
      meusItens[index].pegou = meusItens[index].pegou ? '' : (usuarioAtual || 'Alguém');
      salvarDados();
      renderizarMercado();
    }

    function finalizarCompra() {
      const itensComprados = meusItens.filter(i => i.comprar);
      if (itensComprados.length === 0) return alert("Nenhum item selecionado para compra.");

      const registro = {
        data: new Date().toLocaleDateString('pt-BR'),
        comprador: usuarioAtual || 'Anônimo',
        total: document.getElementById('total-geral').innerText,
        itens: itensComprados.map(i => `${i.nome} (${i.marca || 'S/M'}) - R$ ${i.preco}`)
      };

      historicoCompras.unshift(registro);

      // Atualiza o estoque somando o que foi comprado
      meusItens.forEach(item => {
        if (item.comprar) {
          item.estoqueAtual += 1;
          item.comprar = false;
        }
      });

      localStorage.setItem('historico_compras', JSON.stringify(historicoCompras));
      salvarDados();
      alert("Compra finalizada! Estoque atualizado.");
      mudarAba('historico');
    }
